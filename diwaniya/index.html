<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="لعبة تخمين لفريقين: 6 أسئلة بفئات مخفية، لكل سؤال 20 جواب، مع مؤقتات ومميزات ولوحة حكم على الجوال.">
<title>ديوانية مشربية الكوت</title>
<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: night majlis — lattice (mashrabiya) ground, two brass scoreboards, category cards with a 20-step points ladder */
:root{
  --bg:#1c1220; --bg-2:#241828; --card:#2c1f31; --ink:#f5ecdc; --muted:#b7a6b0;
  --brass:#d9a441; --brass-ink:#24160a; --turq:#46c1b6; --rose:#ef6f62;
  --line:#463449; --used:#211725; --lattice:rgba(217,164,65,.07);
  --f-display:"Lalezar","Tajawal",Tahoma,sans-serif;
  --f-body:"Tajawal",Tahoma,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f6efe4; --bg-2:#efe5d5; --card:#fffaf1; --ink:#2a1a2e; --muted:#76646f;
  --brass:#b07a17; --brass-ink:#fff8ea; --turq:#147a72; --rose:#c2453a;
  --line:#e2d3bf; --used:#ede3d3; --lattice:rgba(122,74,110,.07); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f6efe4; --bg-2:#efe5d5; --card:#fffaf1; --ink:#2a1a2e; --muted:#76646f;
  --brass:#b07a17; --brass-ink:#fff8ea; --turq:#147a72; --rose:#c2453a;
  --line:#e2d3bf; --used:#ede3d3; --lattice:rgba(122,74,110,.07); color-scheme:light}
*{box-sizing:border-box}
html,body{min-height:100%}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  background-color:var(--bg);
  background-image:
    repeating-linear-gradient(45deg,var(--lattice) 0 2px,transparent 2px 22px),
    repeating-linear-gradient(-45deg,var(--lattice) 0 2px,transparent 2px 22px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.3}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--turq);outline-offset:2px}

/* header */
.top{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
.brand{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 8px;text-align:center}
.brand h1{font-size:1.9rem;color:var(--brass);letter-spacing:.5px}
.brand small{color:var(--muted);font-size:.85rem}
.theme-btn{margin-top:6px;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:.8rem;font-weight:800}
.theme-btn:hover{border-color:var(--brass)}
.team .score,.final b,.slot .pt{direction:ltr;unicode-bidi:isolate}
.qhead{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;padding-block:16px}
.qhead .q-text{font-size:clamp(1.4rem,3.6vw,2.2rem);max-width:none}
.chip.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.clocks{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.turn-clock{display:inline-flex;align-items:baseline;gap:8px;background:var(--card);border:2px solid var(--turq);border-radius:14px;padding:4px 16px}
.turn-clock .lbl{font-size:.82rem;font-weight:800;color:var(--muted)}
.turn-clock .tnum{font-family:var(--f-display);font-size:1.8rem;color:var(--turq);font-variant-numeric:tabular-nums;min-width:2ch;text-align:center}
.turn-clock.low{border-color:var(--rose)}.turn-clock.low .tnum{color:var(--rose)}
.answers{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ans-h{font-size:1.1rem;text-align:center;color:var(--muted)}
.ans-h .note{font-family:var(--f-body);font-size:.8rem}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.slot{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;text-align:start;border:2px solid var(--line);background:var(--bg-2);color:var(--ink);border-radius:14px;padding:10px 12px;min-height:58px;font-weight:800;font-size:1rem;transition:border-color .12s,transform .12s}
.slot:hover:not([disabled]){border-color:var(--brass);transform:translateY(-1px)}
.slot .no{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--brass) 30%,transparent);color:var(--ink);font-size:.85rem}
.slot .txt{min-width:0;overflow-wrap:anywhere}
.slot .hid{color:var(--muted);letter-spacing:2px;font-weight:700}
.slot.hinted .hid{letter-spacing:0;color:var(--brass)}
.slot .pt{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.slot[disabled]{cursor:default}
.slot.got.w0{border-color:var(--brass);background:color-mix(in srgb,var(--brass) 16%,var(--bg-2))}
.slot.got.w1{border-color:var(--turq);background:color-mix(in srgb,var(--turq) 16%,var(--bg-2))}
.slot.got .pt{color:var(--ink)}
.slot.exp{opacity:.7;border-style:dashed}
.slot.exp .txt{color:var(--rose)}
.host{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.modal[hidden]{display:none!important}
.modal{position:fixed;inset:0;background:rgba(10,6,12,.6);display:grid;place-items:center;z-index:20;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal-card{max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;max-height:100%;overflow:auto}
.qr-box{background:#fff;padding:12px;border-radius:12px;min-height:244px;min-width:244px;display:grid;place-items:center;color:#000}
.qr-link{display:flex;gap:8px;width:100%}
.qr-base{width:100%;text-align:start}
.qr-base summary{cursor:pointer;font-weight:700;color:var(--muted)}
.refv .steps{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:560px){.refv .steps{grid-template-columns:repeat(3,minmax(0,1fr))}}
.qr-link input{flex:1;min-width:0;font:inherit;font-size:.8rem;direction:ltr;padding:8px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg-2);color:var(--ink)}
.refv{display:flex;flex-direction:column;gap:12px}
.ref-top{display:flex;gap:8px;flex-wrap:wrap}
.ref-q{font-size:1.4rem}
.ref-scores{display:flex;gap:14px;flex-wrap:wrap;font-weight:700}
.ref-scores b{color:var(--brass);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.ref-turn{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note.warn{color:var(--rose);font-weight:700}
.ref-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ref-list li{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.ref-list li.done{opacity:.6}
.ref-list .no{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--brass) 30%,transparent);font-size:.8rem;font-weight:800}
.ref-list .ra{font-weight:800;min-width:0;overflow-wrap:anywhere}
.ref-list .rp{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ref-list .btn.ok{padding:6px 14px;background:var(--turq);color:var(--bg)}
.ref-list .rs{font-size:.8rem;font-weight:800}
.ref-list .rs.w0{color:var(--brass)}.ref-list .rs.w1{color:var(--turq)}
.btn.big{padding:16px;font-size:1.2rem;width:100%}
.ref-acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigclock{margin-top:8px;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--card);border:3px solid var(--turq);border-radius:20px;padding:6px 26px;min-width:150px}
.bigclock .lbl{font-size:.9rem;font-weight:800;color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bigclock .num{font-family:var(--f-display);font-size:clamp(2.8rem,7vw,4.4rem);line-height:1.05;color:var(--turq);font-variant-numeric:tabular-nums}
.bigclock.low{border-color:var(--rose)}.bigclock.low .num{color:var(--rose)}
.bigclock.paused{border-color:var(--brass)}.bigclock.paused .num{color:var(--brass);font-size:clamp(2rem,5vw,3rem)}
.aid.locked{opacity:.7;cursor:default}
.ref-aids.turn{border-color:var(--brass)}
.slot.hinted .hid{letter-spacing:1px;font-size:1.05rem;color:var(--brass);font-weight:800}
.bonus{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;border:2px solid var(--brass);background:color-mix(in srgb,var(--brass) 10%,var(--card))}
.bonus .q-text{font-size:clamp(1.3rem,3.2vw,2rem);max-width:none}
.ref-bonus{display:flex;flex-direction:column;gap:10px;border:2px solid var(--brass);border-radius:14px;padding:12px;background:color-mix(in srgb,var(--brass) 10%,var(--card))}
.ref-aids{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:10px}
.ref-aids .lbl{font-weight:800;font-size:.9rem;width:100%}
.ref-aid{font-size:.95rem;padding:6px 14px}
.chg{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;border-color:var(--brass)}
@media (max-width:560px){.slots{gap:6px}.slot{padding:8px;gap:6px;min-height:52px;font-size:.9rem}.slot .no{width:24px;height:24px;font-size:.75rem}}
.brand-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.aid.spent{text-decoration:line-through}
.btn.danger{background:var(--rose);color:#fff}
.cat.off{opacity:.45}
.cat-clock{display:inline-flex;align-items:baseline;gap:8px;background:var(--bg-2);border:1.5px solid var(--line);border-radius:999px;padding:4px 14px}
.cat-clock .lbl{font-size:.8rem;color:var(--muted);font-weight:700}
.cat-clock .ctime{font-family:var(--f-display);font-size:1.4rem;color:var(--turq);font-variant-numeric:tabular-nums}
.cat-clock.low .ctime,.chip.clock.low .ctime{color:var(--rose)}
.cat-clock.idle{opacity:.5}
.chip.clock .ctime{font-variant-numeric:tabular-nums}
.sum{display:flex;flex-direction:column;gap:14px}
.sum-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.sum-list li{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.sum-list .sq{min-width:0}
.sum-list .sa{font-weight:800;color:var(--turq)}
.sum-list .sp{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.sum .actions{justify-content:flex-start}
@media (max-width:560px){.sum-list li{grid-template-columns:1fr auto}.sum-list .sp{display:none}}
.theme-btn svg{width:16px;height:16px}
.gen{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.gen ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;width:100%}
.gen li{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;justify-content:space-between;gap:8px;font-weight:700}
.gen li .st{color:var(--muted);font-weight:500}
.gen li.ok .st{color:var(--turq)}
.gen li.fb .st{color:var(--brass)}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--brass);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.note{font-size:.88rem;color:var(--muted)}
.team{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;transition:border-color .2s,box-shadow .2s}
.team.turn{border-color:var(--brass);box-shadow:0 0 0 4px color-mix(in srgb,var(--brass) 22%,transparent)}
.team .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.team .name{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team .score{font-family:var(--f-display);font-size:2rem;color:var(--brass);font-variant-numeric:tabular-nums}
.turn-tag{font-size:.78rem;color:var(--turq);font-weight:800;min-height:1.2em}
.aids{display:flex;gap:6px;flex-wrap:wrap}
.aid{border:1.5px solid var(--turq);background:transparent;color:var(--turq);border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:800}
.aid[disabled]{opacity:.35;cursor:not-allowed}
.aid.on{background:var(--turq);color:var(--bg)}

/* generic */
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}
.btn{border:0;border-radius:12px;padding:12px 22px;font-size:1rem;font-weight:800;background:var(--brass);color:var(--brass-ink)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.ghost:hover{border-color:var(--brass)}
.btn.turq{background:var(--turq);color:var(--bg)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.muted{color:var(--muted)}

/* setup */
.setup{display:flex;flex-direction:column;gap:20px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.names label{display:flex;flex-direction:column;gap:6px;font-weight:800}
.names input{font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg-2);color:var(--ink)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cat{border:2px solid var(--line);background:var(--bg-2);color:var(--ink);border-radius:14px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:1rem}
.cat .glyph{font-family:var(--f-display);font-size:1.8rem;color:var(--brass);line-height:1.1}
.cat.sel{border-color:var(--turq);background:color-mix(in srgb,var(--turq) 14%,var(--card))}
.cat.sel::after{content:"مختارة";font-size:.72rem;color:var(--turq)}
.setup-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.rules{margin:0;padding-inline-start:20px;color:var(--muted);font-size:.95rem}

/* board */
.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.col{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.col h3{font-size:1.35rem;color:var(--brass)}
.col .left{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.cells{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.cell{border:1.5px solid var(--line);background:var(--bg-2);color:var(--ink);border-radius:9px;padding:8px 0;font-weight:800;font-size:.85rem;font-variant-numeric:tabular-nums;transition:transform .12s,border-color .12s,background .12s}
.cell:hover:not([disabled]){transform:translateY(-2px);border-color:var(--brass);background:color-mix(in srgb,var(--brass) 14%,var(--bg-2))}
.cell[disabled]{background:var(--used);color:var(--muted);cursor:default;opacity:.55;font-weight:500}
.cell.w0[disabled]{border-color:var(--brass)}
.cell.w1[disabled]{border-color:var(--turq)}
.board-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* question */
.q{display:flex;flex-direction:column;gap:20px;align-items:center;text-align:center}
.q-meta{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chip{background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:3px 14px;font-size:.9rem;font-weight:800}
.chip.hot{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.q-text{font-family:var(--f-display);font-size:clamp(1.6rem,4.2vw,2.6rem);max-width:26ch;line-height:1.45}
.timer{position:relative;width:110px;height:110px}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:2rem;font-variant-numeric:tabular-nums}
.timer.low .num{color:var(--rose)}
.answer{font-size:1.45rem;font-weight:800;color:var(--turq);background:color-mix(in srgb,var(--turq) 12%,var(--card));border:2px dashed var(--turq);border-radius:14px;padding:12px 24px}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* results */
.res{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.res .big{font-family:var(--f-display);font-size:clamp(2.2rem,6vw,3.4rem);color:var(--brass)}
.final{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.final div{background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:12px 24px;min-width:150px}
.final b{display:block;font-family:var(--f-display);font-size:2.2rem;color:var(--brass);font-variant-numeric:tabular-nums}

.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.step{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.step .sn{font-family:var(--f-display);font-size:1.1rem;color:var(--muted);line-height:1}
.step .sl{font-weight:800;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.step .sc{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.step.now{border-color:var(--brass);box-shadow:0 0 0 3px color-mix(in srgb,var(--brass) 22%,transparent)}
.step.now .sn{color:var(--brass)}
.step.done{background:var(--used)}
.step.done .sn{color:var(--turq)}
.col.big{padding:20px}
.col.big h3{font-size:1.6rem}
.cells.solo{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(5,auto);grid-auto-flow:column;gap:10px}
.cells.solo .cell{font-family:var(--f-display);font-weight:400;font-size:1.5rem;padding:16px 0;border-radius:12px}
.wait{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:30px 0}
@media (max-width:900px){.board{grid-template-columns:1fr}.steps{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){
  .top{grid-template-columns:1fr 1fr}
  .brand{grid-column:1/-1;order:-1}
  .names{grid-template-columns:1fr}
  .cells{grid-template-columns:repeat(5,minmax(0,1fr))}
  .cells.solo{gap:6px;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(10,auto)}
  .cells.solo .cell{font-size:1.1rem;padding:12px 0}
  .panel{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap" dir="rtl" lang="ar">
  <header class="top">
    <div class="team" id="t0">
      <div class="row"><span class="name" id="n0">الفريق الأول</span><span class="score" id="s0">0</span></div>
      <div class="turn-tag" id="tt0"></div>
      <div class="aids" id="a0"></div>
    </div>
    <div class="brand"><h1>ديوانية مشربية الكوت</h1><small>تحدي الفريقين</small><div class="bigclock" id="bigclock" hidden><span class="lbl" id="bigLbl"></span><span class="num" id="bigNum"></span></div><span class="brand-btns"><button class="theme-btn" id="themeBtn" type="button"></button><button class="theme-btn" id="qrBtn" type="button">QR الحكم</button></span></div>
    <div class="team" id="t1">

/* ---------- sound ---------- */
let actx=null;
function tone(freq,start,dur,type="sine",vol=.22){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume();
    const t0=actx.currentTime+start, o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.value=freq; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.start(t0); o.stop(t0+dur+.05);
  }catch(e){}
}

      const b=document.createElement("button");b.className="aid";b.type="button";

      if(on) b.classList.add("on");
      if(!n && !on) b.classList.add("spent");
      let ok = (k==="double" ? play : active) && n>0;
      ok = ok && !S.bonus && !locked;
      if(k==="pass") ok = ok && !S.t.passed && !S.t.extra;
      if(k==="two") ok = ok && !S.t.passed && !S.t.extra;
      if(k==="double") ok = ok && canBonus(i);
      if(k==="hint") ok = ok && hintTarget()>=0;

      box.appendChild(b);

      <li>الفرق تتناوب: كل فريق عنده 30 ثانية يقول جواب. المضيف يضغط على الجواب إذا كان صح، أو على «غلط».</li>
      <li>لكل سؤال 7 دقائق. إذا خلص الوقت تنكشف كل الأجوبة الباقية وتنتقلون للسؤال التالي.</li>
      <li>مميزات كل فريق في الجولة: <b>دبل النقاط</b>، <b>جاوب جوابين</b>، <b>باس</b> (صح = ضعف النقاط، غلط = خصم 500)، و<b>تلميحين</b>.</li>
      <li>كل جولة تتجهز بأسئلة جديدة، وما يتكرر سؤال سبق ظهر عندكم.</li>
    </ul>
    <div class="setup-foot"><span class="muted" id="cnt"></span><span class="actions"><button class="btn ghost" id="rnd" type="button">اختيار عشوائي</button><button class="btn" id="go" type="button">ابدأ اللعب</button></span></div>
  </section>`;
  ["in0","in1"].forEach((id,i)=>$(id).oninput=e=>{S.names[i]=e.target.value.trim()||(i?"الفريق الثاني":"الفريق الأول");header();save();});
  const box=$("cats");
  Object.entries(BANK).forEach(([k,c])=>{
    const on=S.cats.includes(k);
    const b=document.createElement("button");b.type="button";b.className="cat"+(on?" sel":"");
    b.innerHTML=`<span class="glyph">${c.g}</span>${c.name}`;
    b.setAttribute("aria-pressed",on);
    if(!on&&S.cats.length>=6){b.disabled=true;b.classList.add("off");}
    b.onclick=()=>{S.cats = on ? S.cats.filter(x=>x!==k) : [...S.cats,k]; render();};
    box.appendChild(b);
  });
  $("cnt").textContent=`اخترتم ${S.cats.length} من 6 فئات`;
  $("go").disabled=S.cats.length!==6;
  $("rnd").onclick=()=>{const ks=Object.keys(BANK);for(let i=ks.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ks[i],ks[j]]=[ks[j],ks[i]];}S.cats=ks.slice(0,6);render();};
  $("go").onclick=()=>{
    for(let i=S.cats.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[S.cats[i],S.cats[j]]=[S.cats[j],S.cats[i]];} // play order is a surprise
    tone(1,0,.01,"sine",.0001); // unlock audio on this click
    Object.assign(S,{round:{},rev:{},hints:{},catEnd:{},done:{},curCat:0,scores:[0,0],aids:[newAids(),newAids()],t:newTurn(0),undo:[],phase:"play"});
    S.cats.forEach(k=>{ const it=bankPick(k); if(it){ S.round[k]=topTen(it); S.rev[k]={}; S.hints[k]={}; } });
    render();
  };
}

/* ---------- question preparation ---------- */
const WHY = {
  hard:{label:"صعب",p:o=>`اللاعبون رفضوا السؤال «${o}» لأنه صعب. اجعل السؤال الجديد أسهل بوضوح، وأجوبته معروفة لعامة الناس.\n`},
  dup:{label:"مكرر",p:o=>`اللاعبون رفضوا السؤال «${o}» لأنه مكرر عندهم. اختر موضوعًا مختلفًا تمامًا داخل الفئة، لا يشبهه ولا يشترك معه في الأجوبة.\n`},
  unclear:{label:"غير واضح",p:o=>`اللاعبون رفضوا السؤال «${o}» لأنه غير واضح. اكتب سؤالًا محددًا لا يحتمل أكثر من فهم.\n`},
  wrong:{label:"فيه أخطاء",p:o=>`اللاعبون رفضوا السؤال «${o}» لأن أجوبته فيها أخطاء. اكتب سؤالًا أجوبته مؤكدة 100% وراجعها جيدًا.\n`}
};
async function generate(k,signal,why){
  const past=(seen[k]||[]).slice(-80).map(q=>"- "+q).join("\n")||"(لا يوجد)";
  const prompt=`أنت معدّ أسئلة لمسابقة عربية بين فريقين. كل سؤال له 10 أجوبة مخفية، والفرق تحاول تخمينها.
الفئة: ${BANK[k].name} (${DESC[k]}).
اكتب سؤالًا واحدًا جديدًا من نوع «اذكر ...» له 15 جوابًا صحيحًا على الأقل، ثم اكتب أشهر 10 أجوبة مرتّبة من الأشهر والأسهل (الأول) إلى الأصعب والأقل شهرة (العاشر).
الشروط:
- السؤال قصير وواضح ومحدد، ولا يكون له أكثر من 40 جوابًا ممكنًا تقريبًا حتى يكون التخمين ممتعًا.
- كل جواب من كلمة إلى أربع كلمات، صحيح ومؤكد ولا خلاف عليه، ولا يعتمد على معلومة تتغير مع الوقت.
- لا تكرر جوابًا، ولا تكتب جوابين بمعنى واحد.
- ممنوع أن يكون السؤال مشابهًا لأي سؤال من هذه الأسئلة المستخدمة سابقًا:
${past}
${why&&WHY[why.r]?WHY[why.r].p(why.old):""}أعد فقط JSON بهذا الشكل بدون أي نص آخر: {"q":"اذكر ...","a":["جواب 1","جواب 2", "... حتى 10"]}`;
  const r=await sampleFn.json(prompt,{cache:false,signal});
  if(!r||typeof r.q!=="string"||!Array.isArray(r.a)) throw {code:"invalid_json"};
  const seenA=new Set(), a=[];
  r.a.forEach(x=>{ if(typeof x!=="string"||!x.trim()) return; const n=norm(x); if(seenA.has(n)) return; seenA.add(n); a.push(x.trim()); });
  if(a.length<PER) throw {code:"short"};
  if((seen[k]||[]).some(x=>norm(x)===norm(r.q))) throw {code:"repeat"};
  return {q:r.q.trim(), a:a.slice(0,PER)};
}
const topTen = it => it ? {q:it.q, a:it.a.slice(0,PER)} : it;
function bankPick(k){
  const used=new Set((seen[k]||[]).map(norm));
  const c=BANK[k].q.filter(x=>!used.has(norm(x.q)));
  return c.length ? c[Math.floor(Math.random()*c.length)] : null;
}
const pending={}, ctls={};
function ensureCat(k){
  if(S.round[k]!==undefined) return Promise.resolve();
  if(pending[k]) return pending[k];
  pending[k]=(async()=>{
    let item=bankPick(k); // ready-made questions first: no waiting
    if(!item && sampleFn){ ctls[k]=new AbortController(); try{ item=await generate(k,ctls[k].signal,(S.reason||{})[k]); }catch(e){ item=null; } }
    if(!item) item=bankPick(k);
    S.round[k]=topTen(item); S.rev[k]={}; S.hints[k]={}; if(S.reason) delete S.reason[k];
    delete pending[k]; delete ctls[k]; save();
    if(S.phase==="play") render();
  })();
  return pending[k];
}

/* ---------- play ---------- */
function steps(){
  return `<nav class="steps" aria-label="أسئلة الجولة">${S.cats.map((x,i)=>{
    const st = S.done[x]?"done":(i===S.curCat?"now":"");
    const r=S.rev[x]||{}, got=Object.values(r).filter(v=>v>=0).length;
    return `<div class="step ${st}"><span class="sn">${i+1}</span><span class="sl">${S.done[x]?BANK[x].name:"فئة مخفية"}</span><span class="sc">${S.done[x]?"انتهى":(S.round[x]?got+"/"+PER:"—")}</span></div>`;
  }).join("")}</nav>`;
}
function hintTarget(){
  const k=curKey(), item=S.round[k]; if(!item) return -1;
  for(let i=0;i<item.a.length;i++) if(S.rev[k][i]===undefined && !S.hints[k][i]) return i;
  return -1;
}
// Hint: show about half of the letters of the easiest hidden answer, e.g. «الرياض» → «ا ل ـ ي ـ ض».
function hintText(ans){
  const words=String(ans).split(/\s+/).filter(Boolean);
  return words.map(w=>{ const ch=[...w.replace(/[\u064B-\u0652]/g,"")]; return ch.map((c,i)=>(i%2===0||i===ch.length-1)?c:"ـ").join(" "); }).join("   ");
}
function play(v){
  const k=curKey(), c=BANK[k], item=S.round[k];
  if(item===undefined){
    v.innerHTML=`${steps()}<section class="panel wait"><div class="spin" aria-hidden="true"></div><h3>${(S.reason||{})[k]?"نجهّز سؤال بديل":"نجهّز السؤال "+(S.curCat+1)}</h3>
      <p class="note">${sampleFn?"نكتب سؤال جديد بـ10 أجوبة، وقد يأخذ هذا دقيقة تقريبًا. الوقت يبدأ بعد ما يجهز.":"نجهّز السؤال."}</p>
      ${sampleFn?'<button class="btn ghost" id="skip" type="button">تخطَّ واستخدم سؤال جاهز</button>':""}</section>`;
    ensureCat(k); if($("skip")) $("skip").onclick=()=>ctls[k]&&ctls[k].abort();
    return;
  }
  if(item===null){
    v.innerHTML=`${steps()}<section class="panel wait"><h3>خلصت الأسئلة الجاهزة لهذا السؤال</h3>
      <p class="note">ظهرت عندكم كل أسئلة هذه الفئة المحفوظة، وما قدرنا نكتب سؤال جديد الحين.</p>
      <div class="actions"><button class="btn" id="clr" type="button">صفّر سجل الأسئلة</button><button class="btn ghost" id="skipcat" type="button">تخطَّ الفئة</button></div></section>`;
    $("clr").onclick=()=>{seen={};saveSeen();delete S.round[k];render();};
    $("skipcat").onclick=()=>{S.done[k]=true;nextQ();};
    return;
  }
  if(!S.catEnd[k] && !S.done[k]){ S.catEnd[k]=Date.now()+CATTIME*1000; markSeen(k,item.q); S.qStart={scores:S.scores.slice(),aids:JSON.parse(JSON.stringify(S.aids)),team:S.t.team}; startTurnTimer(); save(); }
  const done=!!S.done[k], last=S.curCat>=S.cats.length-1;
  const tags=[];
  if(!done){
    if(S.t.extra>0) tags.push('<span class="chip hot">باقي جواب إضافي</span>');
    if(S.t.passed) tags.push(`<span class="chip hot">باس: صح ×2 · غلط −${PASS_PENALTY}</span>`);
    if(S.t.stopped) tags.push('<span class="chip hot">الوقت موقوف</span>');
  }
  const slots=item.a.map((ans,i)=>{
    const r=S.rev[k][i];
    let cls="slot", txt='<span class="hid">؟؟؟؟؟</span>';
    if(r!==undefined){ cls+= r>=0?` got w${r}`:" exp"; txt=esc(ans); }
    else if(S.hints[k][i]){ cls+=" hinted"; txt=`<span class="hid">${esc(hintText(ans))}</span>`; }
    return `<button type="button" class="${cls}" data-i="${i}" ${r!==undefined||done?"disabled":""} aria-label="جواب ${i+1}"><span class="no">${i+1}</span><span class="txt">${txt}</span><span class="pt">${r!==undefined?"+"+pts(i):"؟"}</span></button>`;
  }).join("");
  v.innerHTML=`${steps()}
    <section class="panel qhead">
      <div class="q-meta"><span class="chip dark">سؤال ${S.curCat+1} من ${S.cats.length}</span>${done?`<span class="chip">الفئة: ${c.name}</span>`:""}</div>
      <h2 class="q-text">${esc(item.q)}</h2>
    </section>
    <div class="clocks">
      <span class="cat-clock" id="cc"><span class="lbl">وقت السؤال</span><span class="ctime">${mmss(done?0:catTimeLeft(k))}</span></span>
      ${done?"":`<span class="turn-clock" id="tc"><span class="lbl">دور ${esc(S.names[S.t.team])}</span><span class="tnum" id="tn">${S.t.stopped?"موقوف":S.t.timeUp?"انتهى":turnLeft}</span></span>`}
      ${tags.join("")}
    </div>
    ${S.bonus&&!done?bonusPanel():""}
    <section class="answers"><h3 class="ans-h">الإجابات <span class="note">${done?"":"(اضغط على الجواب الصح لما يقوله الفريق)"}</span></h3><div class="slots" id="slots">${slots}</div></section>
    <div class="host">
      ${done
        ? `<button class="btn" id="nextq" type="button">${last?"النتيجة النهائية":"السؤال التالي"}</button>`
        : `<button class="btn danger" id="wrong" type="button">غلط${S.t.passed?` (−${PASS_PENALTY})`:""}</button><button class="btn ghost" id="swap" type="button">تبديل الدور</button><button class="btn ghost" id="undo" type="button" ${S.undo.length?"":"disabled"}>تراجع</button><button class="btn ghost" id="revall" type="button">إظهار كل الأجوبة</button><button class="btn ghost" id="chg" type="button">تغيير السؤال</button>`}
      <button class="btn ghost" id="rst" type="button">لعبة جديدة</button>
    </div>
    <div class="panel chg" id="chgbox" hidden><b>ليش تبي تغير السؤال؟</b>
      <div class="actions">${Object.entries(WHY).map(([r,o])=>`<button class="btn" type="button" data-r="${r}">${o.label}</button>`).join("")}<button class="btn ghost" id="chgx" type="button">إلغاء</button></div>
      <p class="note">النقاط والمميزات اللي اناخذت في هذا السؤال ترجع مثل ما كانت، والسؤال المرفوض ما يرجع لكم.</p></div>`;
  if(!done && S.bonus){
    $("bok").onclick=()=>endBonus(true); $("bno").onclick=()=>endBonus(false);
    v.querySelectorAll(".slot").forEach(b=>b.disabled=true);
    ["wrong","swap","undo","revall","chg"].forEach(id=>{ const b=$(id); if(b) b.disabled=true; });
  }
  if(!done){
    v.querySelectorAll(".slot:not([disabled])").forEach(b=>b.onclick=()=>correct(+b.dataset.i));
    $("wrong").onclick=wrong;
    $("undo").onclick=undo;
    $("swap").onclick=switchTurn;
    armConfirm($("revall"),"إظهار كل الأجوبة",()=>finishQ(false));
    $("chg").onclick=()=>{$("chgbox").hidden=false;$("chgbox").scrollIntoView({block:"nearest"});};
    $("chgx").onclick=()=>{$("chgbox").hidden=true;};
    v.querySelectorAll("#chgbox [data-r]").forEach(b=>b.onclick=()=>changeQ(b.dataset.r));
    const nx=S.cats[S.curCat+1]; if(nx) ensureCat(nx); // prepare the next question meanwhile
  }else $("nextq").onclick=nextQ;
  armConfirm($("rst"),"لعبة جديدة",()=>{const {names,cats,hideScores}=S; stopTurnTimer(); S=fresh(); Object.assign(S,{names,cats,hideScores}); render();});
}
function armConfirm(btn,label,fn){
  if(!btn) return; let armed=false;
  btn.onclick=()=>{
    if(!armed){armed=true;btn.textContent="متأكد؟ اضغط مرة ثانية";setTimeout(()=>{armed=false;btn.textContent=label;},3000);return;}
    fn();
  };
}

function snapshot(){ S.undo.push(JSON.stringify({scores:S.scores,rev:S.rev[curKey()],hints:S.hints[curKey()],aids:S.aids,t:S.t,last:S.last||null})); if(S.undo.length>30) S.undo.shift(); }
function undo(){
  const x=S.undo.pop(); if(!x) return; const o=JSON.parse(x), k=curKey();
  if(S.bonus) return;
  resumeClock(); S.scores=o.scores; S.rev[k]=o.rev; S.hints[k]=o.hints; S.aids=o.aids; S.t=o.t; S.last=o.last;
  if(S.t.stopped){ S.t.stopAt=Date.now(); stopTurnTimer(); } else startTurnTimer();
  render();
}
function correct(i){
  const k=curKey(); if(S.done[k]||S.rev[k][i]!==undefined) return;
  snapshot();
  if(S.bonus) return;
  const mult=S.t.passed?2:1;
  S.scores[S.t.team]+=pts(i)*mult; S.rev[k][i]=S.t.team; sfx.reveal();
  S.last=S.last&&S.last.k===k?S.last:{k,pts:[0,0]}; S.last.pts[S.t.team]=pts(i)*mult; // points of this team's latest correct answer
  afterAnswer();
}
function wrong(){
  if(S.bonus) return;
  snapshot();
  if(S.t.passed) S.scores[S.t.team]-=PASS_PENALTY;
  sfx.wrong();
  afterAnswer();
}
function resumeClock(){
  const k=curKey();
  if(S.t.stopped){ if(S.catEnd[k]) S.catEnd[k]+=Date.now()-(S.t.stopAt||Date.now()); S.t.stopped=false; S.t.stopAt=0; }
}
function switchTurn(){
  const k=curKey(); if(S.phase!=="play"||!S.round[k]||S.done[k]||S.bonus) return;
  snapshot(); resumeClock(); S.t=newTurn(1-S.t.team); startTurnTimer(); render();
}
function afterAnswer(){
  const k=curKey();
  resumeClock();
  if(Object.keys(S.rev[k]).length>=PER){ finishQ(false); return; }
  if(S.t.extra>0 && !S.t.passed){ S.t.extra--; S.t.timeUp=false; }
  else S.t=newTurn(1-S.t.team);
  startTurnTimer(); render();
}
/* ---------- double question ----------
   After 3 correct answers in the current question, a team may take one question from the same category.
   20 seconds to give one of its answers; if right, the points of the team's latest correct answer are added again, if wrong they are taken off. */
function correctCount(team){ const r=S.rev[curKey()]||{}; return Object.values(r).filter(v=>v===team).length; }
function lastPts(team){ const k=curKey(); return S.last&&S.last.k===k ? S.last.pts[team]||0 : 0; }
function bonusPick(k){
  const used=new Set((seen[k]||[]).map(norm)); S.cats.forEach(c=>{ if(S.round[c]) used.add(norm(S.round[c].q)); });
  const c=BANK[k].q.filter(x=>!used.has(norm(x.q)));
  return c.length ? topTen(c[Math.floor(Math.random()*c.length)]) : null;
}
function canBonus(team){ return !S.bonus && S.aids[team].double>0 && correctCount(team)>=3 && lastPts(team)>0 && bonusPick(curKey())!==null; }
function startBonus(team){
  const k=curKey(); if(!canBonus(team)) return;
  const item=bonusPick(k); markSeen(k,item.q);
  S.aids[team].double--; S.undo=[];
  S.bonus={team,item,base:lastPts(team),end:Date.now()+BONUS_TIME*1000,pausedAt:Date.now(),timeUp:false};
  stopTurnTimer(); sfx.hint(); render();
}
function endBonus(ok){
  const b=S.bonus; if(!b) return;
  if(ok){ S.scores[b.team]+=b.base; sfx.reveal(); } else { S.scores[b.team]-=b.base; sfx.wrong(); }
  const k=curKey(); if(S.catEnd[k] && !S.t.stopped) S.catEnd[k]+=Date.now()-b.pausedAt; // the question clock was paused during the double question
  S.bonus=null;
  if(S.t.stopped) S.t.stopAt=Date.now(); else startTurnTimer();
  render();
}
function bonusPanel(){
  const b=S.bonus, left=Math.max(0,Math.ceil((b.end-Date.now())/1000));
  return `<section class="panel bonus">
    <div class="q-meta"><span class="chip hot">سؤال الدبل · ${esc(S.names[b.team])}</span><span class="chip">صح: +${b.base} · غلط أو خلص الوقت: −${b.base}</span></div>
    <h2 class="q-text">${esc(b.item.q)}</h2>
    <span class="turn-clock" id="bc"><span class="lbl">الوقت</span><span class="tnum" id="bn">${left<=0?"انتهى":left}</span></span>
    <div class="actions"><button class="btn turq" id="bok" type="button">صح: +${b.base}</button><button class="btn danger" id="bno" type="button">غلط: −${b.base}</button></div>
  </section>`;
}
setInterval(()=>{
  if(!S.bonus||IS_REF) return;
  bigClock();
  const left=Math.max(0,Math.ceil((S.bonus.end-Date.now())/1000)), n=$("bn"), c=$("bc");
  if(n) n.textContent = left<=0 ? "انتهى" : left;
  if(c) c.classList.toggle("low",left<=5);
  if(left<=0 && !S.bonus.timeUp){ S.bonus.timeUp=true; sfx.timeUp(); }
},250);
function useAid(i,k){
  if(S.phase!=="play"||!S.aids[i][k]||S.bonus) return;
  if(k!=="double"&&S.t.team!==i) return; // the double question may be taken by either team that has 3 correct answers
  const ck=curKey(); if(!S.round[ck]||S.done[ck]) return;
  if(k==="hint"){ const h=hintTarget(); if(h<0) return; snapshot(); S.hints[ck][h]=true; S.aids[i].hint--; sfx.hint(); render(); return; }
  if(k==="stop"){ if(S.t.stopped) return; snapshot(); S.aids[i].stop--; S.t.stopped=true; S.t.stopAt=Date.now(); stopTurnTimer(); sfx.hint(); render(); return; }
  if(k==="double"){ startBonus(i); return; }
  snapshot(); S.aids[i][k]--;
  if(k==="two") S.t.extra=1;
  if(k==="pass"){ S.t={team:1-i,double:false,extra:0,passed:true,timeUp:false}; startTurnTimer(); }
  render();
}
function changeQ(reason){
  const k=curKey(), old=S.round[k]; if(!old||S.done[k]||S.bonus) return;
  stopTurnTimer(); markSeen(k,old.q);
  if(S.qStart){ S.scores=S.qStart.scores.slice(); S.aids=JSON.parse(JSON.stringify(S.qStart.aids)); S.t=newTurn(S.qStart.team); }
  S.reason=S.reason||{}; S.reason[k]={r:reason,old:old.q};
  delete S.round[k]; S.rev[k]={}; S.hints[k]={}; delete S.catEnd[k]; S.undo=[];
  render();
}
function finishQ(timeOver){
  stopTurnTimer(); S.bonus=null;
  const k=curKey(), item=S.round[k];
  item.a.forEach((_,i)=>{ if(S.rev[k][i]===undefined) S.rev[k][i]=-2; });
  S.done[k]=true; S.undo=[]; sfx.catEnd(); render();
}
function nextQ(){
  if(S.curCat>=S.cats.length-1){ S.phase="end"; }
  else { S.curCat++; S.t=newTurn(S.curCat%2); S.undo=[]; }
  render();
}

/* ---------- timers ---------- */
// The turn clock counts against a fixed end time, so it stays right even if the screen sleeps or the tab is in the background.
let turnTimer=null, turnLeft=QTIME, turnEnd=0;
function turnTick(){
  turnLeft=Math.max(0,Math.ceil((turnEnd-Date.now())/1000));
  bigClock();
  const n=$("tn"), c=$("tc");
  if(n) n.textContent = turnLeft<=0 ? "انتهى" : turnLeft;
  if(c) c.classList.toggle("low",turnLeft<=10);
  if(turnLeft<=0){ stopTurnTimer(); S.t.timeUp=true; sfx.timeUp(); }
}
function startTurnTimer(){
  stopTurnTimer(); turnEnd=Date.now()+QTIME*1000; turnLeft=QTIME; S.t.timeUp=false;
  turnTimer=setInterval(turnTick,250);
}
function stopTurnTimer(){ if(turnTimer){clearInterval(turnTimer);turnTimer=null;} }
setInterval(()=>{
  if(S.phase!=="play") return;
  const k=curKey(); if(!S.catEnd[k]||S.done[k]||S.t.stopped||S.bonus) return;
  const t=catTimeLeft(k), cc=$("cc");
  if(cc){ cc.querySelector(".ctime").textContent=mmss(t); cc.classList.toggle("low",t<=60); }
  if(t<=0) finishQ(true);
},500);

/* ---------- results ---------- */
function results(v){
  stopTurnTimer();
  const [a,b]=S.scores;
  const title = a===b ? "تعادل!" : `الفوز لـ ${esc(S.names[a>b?0:1])}`;
  v.innerHTML=`<section class="panel res">
    <div class="big">${title}</div>
    <div class="final"><div>${esc(S.names[0])}<b>${a}</b></div><div>${esc(S.names[1])}<b>${b}</b></div></div>
    <div class="actions"><button class="btn" id="again" type="button">جولة جديدة بنفس الفرق</button></div>
  </section>`;
  $("again").onclick=()=>{const {names,cats,hideScores}=S;S=fresh();Object.assign(S,{names,cats,hideScores});render();};
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}


/* ---------- referee (phone) link through the live room ---------- */
const DEFAULT_BASE = location.origin + location.pathname, BASE_KEY = "mashrabiya-base";
const STANDALONE = !window.claude; // served as a plain web page, not inside Claude
const REF_PARAM = (/[?&]ref=([a-z0-9-]*)/.exec(location.search)||[])[1];
const IS_REF = location.hash.indexOf("#ref") === 0 || REF_PARAM !== undefined;
// "#ref-geo12-hist3-..." carries the round's question numbers, so the referee page works without any account or connection
const REF_IDS = (location.hash.indexOf("#ref-") === 0 ? location.hash.slice(5) : (REF_PARAM||"")).split("-").filter(Boolean);
let refTab = 0;
function baseUrl(){ try{ const v=localStorage.getItem(BASE_KEY); if(v&&/^https:\/\/\S+$/.test(v)) return v.split("#")[0]; }catch(e){} return DEFAULT_BASE; }
function refHash(){
  return "ref-"+S.cats.map(k=>{ const it=S.round[k]; const i=it?BANK[k].q.findIndex(x=>x.q===it.q):-1; return k+(i>=0?i:"x"); }).join("-");
}
function refUrl(){ const ids=S.phase==="play"?refHash().slice(4):""; return STANDALONE ? baseUrl().split("?")[0]+"?ref="+ids+"&room="+roomCode() : baseUrl()+"#"+(ids?"ref-"+ids:"ref"); }
function renderStaticRef(){
  const v=$("view");
  const items=REF_IDS.map(id=>{ const m=/^([a-z]+)(\d+|x)$/.exec(id); if(!m||!BANK[m[1]]) return null; const k=m[1]; return {k, it: m[2]==="x"?null:BANK[k].q[+m[2]]||null}; }).filter(Boolean);
  if(!items.length){ v.innerHTML=`<section class="panel wait"><h2>لوحة الحكم</h2><p class="note">الرابط ناقص. امسح الباركود من شاشة اللعبة بعد ما تبدأ الجولة.</p></section>`; return; }
  refTab=Math.min(refTab,items.length-1);
  const cur=items[refTab];
  const tabs=items.map((x,i)=>`<button type="button" class="step ${i===refTab?"now":""}" data-t="${i}"><span class="sn">${i+1}</span><span class="sl">${esc(BANK[x.k].name)}</span></button>`).join("");
  const body = cur.it
    ? `<h2 class="ref-q">${esc(cur.it.q)}</h2><ol class="ref-list">${cur.it.a.slice(0,PER).map((a,i)=>`<li><span class="no">${i+1}</span><span class="ra">${esc(a)}</span><span class="rp">${pts(i)}</span></li>`).join("")}</ol>`
    : `<p class="note">هذا السؤال انكتب أثناء اللعب وما ينعرض هنا. اطلب من المضيف يفتح «QR الحكم» من جديد بعد ما يجهز السؤال.</p>`;
  v.innerHTML=`<section class="panel refv">
    <div class="ref-top"><span class="chip dark">لوحة الحكم · الأجوبة</span></div>
    <p class="note warn">لا تعرض هذه الشاشة على الفريقين: فيها كل الأجوبة.</p>
    <nav class="steps">${tabs}</nav>
    ${body}
    <p class="note">${ROOM_PARAM&&STANDALONE?"نتصل بشاشة اللعبة عشان تقدر تضغط صح وغلط من هنا…":"قل للمضيف «صح» أو «غلط»، وهو يضغط على الشاشة الكبيرة."} إذا تغيّر سؤال، امسح الباركود من جديد.</p>
  </section>`;
  v.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ refTab=+b.dataset.t; renderStaticRef(); scrollTo(0,0); });
}
let room = null, roomState = "connecting", refPeers = [];
if(window.claude && claude.use){
  claude.use("room").then(r=>{
    room = r; roomState = r ? "on" : "off";
    if(!r){ if(IS_REF) renderRef(); return; }
    if(IS_REF){
      r.onPeers(ch=>{ refPeers = ch.peers || r.peers(); renderRef(); }, ()=>{ roomState="off"; renderRef(); });
    }else{
      r.on("ref", m=>applyRef(m.data));
      pushState();
    }
  }).catch(()=>{ roomState="off"; if(IS_REF) renderRef(); });
}else roomState="off";

const SB_URL="https://mxocmwkxnihenqmfhjcc.supabase.co", SB_KEY="sb_publishable_NgFczrw5qNiMZN_VDpdeQg_0wcG4wxD", CODE_KEY="mashrabiya-room";
const ROOM_PARAM=(/[?&]room=([a-z0-9]{4,12})/.exec(location.search)||[])[1];
let sbChan=null, sbReady=false, sbLive=null, lastRefSeen=0, helloTimer=null, refWasOnline=false;
function refOnline(){ return Date.now()-lastRefSeen < 25000; }
setInterval(()=>{ const on=refOnline(); if(on!==refWasOnline){ refWasOnline=on; if(!IS_REF) header(); } },3000);
function roomCode(){
  let c=null; try{ c=localStorage.getItem(CODE_KEY); }catch(e){}
  if(!c||!/^[a-z0-9]{6}$/.test(c)){ c=Math.random().toString(36).slice(2,8).padEnd(6,"0"); try{ localStorage.setItem(CODE_KEY,c); }catch(e){} }
  return c;
}
function startSync(){
  if(!STANDALONE||!window.supabase||!window.supabase.createClient) return;
  const code = IS_REF ? ROOM_PARAM : roomCode(); if(!code) return;
  try{
    const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false}});
    sbChan=sb.channel("diwaniya-"+code,{config:{broadcast:{self:false}}});
    if(IS_REF){
      sbChan.on("broadcast",{event:"state"},m=>{ sbLive=m.payload; renderRef(); });
    }else{
      sbChan.on("broadcast",{event:"ref"},m=>applyRef(m.payload));
      sbChan.on("broadcast",{event:"hello"},()=>{ const was=refOnline(); lastRefSeen=Date.now(); pushState(); if(!was) header(); });
    }
    sbChan.subscribe(st=>{
      sbReady = st==="SUBSCRIBED";
      if(!sbReady) return;
      if(IS_REF){ const hi=()=>sbChan.send({type:"broadcast",event:"hello",payload:{}}).catch(()=>{}); hi(); if(!helloTimer) helloTimer=setInterval(hi,8000); }
      else pushState();
    });
  }catch(e){}
}
function hostState(){
  const k=curKey(), item=S.round&&S.round[k];
  const base={names:S.names,scores:S.scores,phase:S.phase};
  if(S.phase!=="play"||!item) return base;
  return Object.assign(base,{n:S.curCat+1,of:S.cats.length,cat:BANK[k].name,q:item.q,a:item.a,rev:S.rev[k]||{},
    team:S.t.team,passed:!!S.t.passed,
    bonus:S.bonus?{team:S.bonus.team,q:S.bonus.item.q,a:S.bonus.item.a,base:S.bonus.base,end:S.bonus.end}:null,
    canDbl:[canBonus(0),canBonus(1)],cnt:[correctCount(0),correctCount(1)],extra:S.t.extra||0,stopped:!!S.t.stopped,aids:S.aids,hintLeft:hintTarget()>=0,done:!!S.done[k]});
}
function pushState(){
  if(IS_REF) return;
  if(sbChan&&sbReady) sbChan.send({type:"broadcast",event:"state",payload:hostState()}).catch(()=>{});
  if(!room) return;
  room.presence({role:"host",st:hostState()}).catch(()=>{ room.presence({role:"host",st:{names:S.names,scores:S.scores,phase:S.phase,big:true}}).catch(()=>{}); });
}
function applyRef(d){
  if(!d||S.phase!=="play") return;
  const k=curKey(), item=S.round[k];
  if(!item||S.done[k]||d.q!==item.q) return; // stale command for another question
  if(d.act==="ok"){ const i=Number(d.i); if(Number.isInteger(i)&&i>=0&&i<item.a.length) correct(i); }
  else if(d.act==="wrong") wrong();
  else if(d.act==="switch") switchTurn();
  else if(d.act==="bonus" && S.bonus) endBonus(!!d.ok);
  else if(d.act==="aid" && AIDS.some(a=>a[0]===d.k)) useAid(d.team===0||d.team===1?d.team:S.t.team,d.k);
}
function sendRef(data){
  if(sbChan&&sbReady){ sbChan.send({type:"broadcast",event:"ref",payload:data}).catch(()=>{ const n=$("refmsg"); if(n) n.textContent="ما وصل الأمر، جرّب مرة ثانية."; }); return; }
  if(!room) return;
  room.emit("ref",data).catch(e=>{
    const n=$("refmsg"); if(n) n.textContent = e&&e.code==="not_permitted" ? "حسابك ما عنده صلاحية يتحكم باللعبة. اطلب من صاحب اللعبة يشاركها معك بصلاحية مساهم أو محرر." : "ما وصل الأمر، جرّب مرة ثانية.";
  });
}
function refAidButtons(st,team){
  const mine=st.aids[team]||{}, turn=team===st.team;
  return AIDS.map(([k,label])=>{
    const n=mine[k]||0;
    const on=(k==="double"&&st.bonus&&st.bonus.team===team)||(turn&&((k==="two"&&st.extra>0)||(k==="pass"&&st.passed)||(k==="stop"&&st.stopped)));
    let ok=n>0&&!on&&(turn||k==="double");
    ok=ok&&!st.bonus;
    if(k==="pass") ok=ok&&!st.passed&&!st.extra;
    if(k==="two") ok=ok&&!st.passed&&!st.extra;
    if(k==="double") ok=ok&&!!(Array.isArray(st.canDbl)?st.canDbl[team]:st.canDbl);
    if(k==="hint") ok=ok&&st.hintLeft!==false;
    const cnt=st.cnt?st.cnt[team]:0;
    const txt = k==="hint" ? `${label} ${n}/${HINTS}` : k==="double"&&n>0&&cnt<3 ? `${label} (${cnt}/3 صح)` : label;
    return `<button type="button" class="aid ref-aid${on?" on":""}${!n&&!on?" spent":""}" data-aid="${k}" data-team="${team}" ${ok?"":"disabled"}>${txt}</button>`;
  }).join("");
}
function renderRef(){
  const v=$("view");
  const liveHost = roomState==="on" && refPeers.find(p=>p.presence&&p.presence.role==="host"&&!p.sameTab&&p.presence.st);
  if(!liveHost && !sbLive && REF_IDS.length) return renderStaticRef();
  if(!sbLive && roomState!=="on"){
    v.innerHTML=`<section class="panel wait"><h2>لوحة الحكم</h2><p class="note">${roomState==="connecting"&&!STANDALONE?"نتصل بشاشة اللعبة…":"هذا الباركود ما فيه أسئلة الجولة لأنه انفتح قبل بداية اللعب. ابدأ الجولة على الشاشة الكبيرة، بعدها اضغط «QR الحكم» وامسح الباركود من جديد."}</p></section>`;
    return;
  }
  const host=sbLive ? {presence:{st:sbLive}} : refPeers.find(p=>p.presence&&p.presence.role==="host"&&!p.sameTab);
  if(!host||!host.presence.st){
    v.innerHTML=`<section class="panel wait"><div class="spin" aria-hidden="true"></div><h2>لوحة الحكم</h2><p class="note">بانتظار شاشة اللعبة. افتح اللعبة على الشاشة الرئيسية بنفس الحساب أو بحساب مشارك معه.</p></section>`;
    return;
  }
  const st=host.presence.st;
  const score=`<div class="ref-scores"><span>${esc(st.names[0])}: <b>${st.scores[0]}</b></span><span>${esc(st.names[1])}: <b>${st.scores[1]}</b></span></div>`;
  if(st.phase!=="play"||!st.q){
    v.innerHTML=`<section class="panel wait"><h2>لوحة الحكم</h2>${score}<p class="note">${st.big?"السؤال الحالي أكبر من أن ينرسل للجوال.":st.phase==="end"?"انتهت الجولة.":"بانتظار بداية السؤال."}</p></section>`;
    return;
  }
  const tags=[];
  if(st.extra>0) tags.push('<span class="chip hot">جواب إضافي</span>');
  if(st.passed) tags.push('<span class="chip hot">باس: صح ×2 · غلط −500</span>');
  if(st.stopped) tags.push('<span class="chip hot">الوقت موقوف</span>');
  const rows=st.a.map((ans,i)=>{
    const r=st.rev[i];
    const state = r===undefined ? "" : r>=0 ? `<span class="rs w${r}">${esc(st.names[r])}</span>` : '<span class="rs">انكشف</span>';
    const btn = r===undefined && !st.done ? `<button class="btn ok" type="button" data-i="${i}">صح</button>` : state;
    return `<li class="${r!==undefined?"done":""}"><span class="no">${i+1}</span><span class="ra">${esc(ans)}</span><span class="rp">${pts(i)}</span>${btn}</li>`;
  }).join("");
  v.innerHTML=`<section class="panel refv">
    <div class="ref-top"><span class="chip dark">لوحة الحكم · سؤال ${st.n} من ${st.of}</span><span class="chip">${esc(st.cat)}</span></div>
    <h2 class="ref-q">${esc(st.q)}</h2>
    ${score}
    <div class="ref-turn">${st.done?"انتهى السؤال":`الدور على <b>${esc(st.names[st.team])}</b>`} ${tags.join("")}</div>
    <p class="note warn">لا تعرض هذه الشاشة على الفريقين: فيها كل الأجوبة.</p>
    ${st.bonus&&!st.done?`<div class="ref-bonus"><span class="chip hot">سؤال الدبل · ${esc(st.names[st.bonus.team])}</span>
      <h3>${esc(st.bonus.q)}</h3><p class="note">أي جواب من هذي صح (+${st.bonus.base}). الغلط أو خلصان الوقت يخصم ${st.bonus.base}:</p>
      <ol class="ref-list">${st.bonus.a.map((x,i)=>`<li><span class="no">${i+1}</span><span class="ra">${esc(x)}</span></li>`).join("")}</ol>
      <div class="ref-acts"><button class="btn turq big" id="rbok" type="button">صح: +${st.bonus.base}</button><button class="btn danger big" id="rbno" type="button">غلط: −${st.bonus.base}</button></div></div>`:""}
    ${st.done||!st.aids?"":[st.team,1-st.team].map(t=>`<div class="ref-aids${t===st.team?" turn":""}"><span class="lbl">مميزات ${esc(st.names[t])}${t===st.team?" (عليه الدور)":""}:</span>${refAidButtons(st,t)}</div>`).join("")}
    <ol class="ref-list">${rows}</ol>
    ${st.done?"":'<div class="ref-acts"><button class="btn danger big" id="refwrong" type="button">غلط</button><button class="btn ghost big" id="refswap" type="button">تبديل الدور</button></div>'}
    <p class="note" id="refmsg"></p>
  </section>`;
  v.querySelectorAll("button.ok").forEach(b=>b.onclick=()=>{ b.disabled=true; sendRef({act:"ok",i:+b.dataset.i,q:st.q}); });
  if($("refwrong")) $("refwrong").onclick=()=>sendRef({act:"wrong",q:st.q});
  if($("refswap")) $("refswap").onclick=()=>sendRef({act:"switch",q:st.q});
  if($("rbok")) $("rbok").onclick=()=>sendRef({act:"bonus",ok:true,q:st.q});
  if($("rbno")) $("rbno").onclick=()=>sendRef({act:"bonus",ok:false,q:st.q});
  v.querySelectorAll("button[data-aid]").forEach(b=>b.onclick=()=>{ b.disabled=true; sendRef({act:"aid",k:b.dataset.aid,team:+b.dataset.team,q:st.q}); });
}

/* ---------- QR modal on the main screen ---------- */
function openQR(){
  const m=$("qrModal"); m.hidden=false;
  const url=refUrl(), box=$("qrBox");

}

  const dark = t ? t==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  $("themeBtn").innerHTML = dark
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>الوضع الفاتح'

  $("themeBtn").onclick=()=>{const nt=dark?"light":"dark";try{localStorage.setItem(THEME,nt)}catch(e){}applyTheme(nt);};
}
applyTheme((()=>{try{return localStorage.getItem(THEME)}catch(e){return null}})());
