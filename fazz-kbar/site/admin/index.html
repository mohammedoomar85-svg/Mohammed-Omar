<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة فز و العب للكبار</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600;700&family=Tajawal:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
main { padding-block: 20px 40px; }
.card { padding: 16px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.bar h1 { font-size: 1.5rem; margin-inline-end: auto; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 6px 12px; cursor: pointer; font-weight: 700; }
.tabs button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.stats .card b { display: block; font-size: 1.5rem; font-family: var(--f-display); }
.orders { display: flex; flex-direction: column; gap: 10px; }
.o-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.o-head .no { font-weight: 800; font-size: 1.1rem; }
.st { border-radius: 999px; padding: 2px 10px; font-size: .82rem; font-weight: 700; background: var(--bg-2); }
.st.new { background: #fde7c7; color: #7a4a00; } .st.paid { background: #d5efe1; color: #145c38; }
.st.shipped, .st.done { background: #d7e8ef; color: #0f4c5c; } .st.cancelled { background: #f6d6cc; color: #8a2b12; }
.o-body { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; margin-top: 10px; font-size: .95rem; }
@media (max-width: 640px) { .o-body { grid-template-columns: 1fr; } }
.o-acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.o-acts .btn { min-height: 38px; padding: 6px 12px; font-size: .92rem; }
.codes { font-family: ui-monospace, Menlo, Consolas, monospace; direction: ltr; text-align: start; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: start; vertical-align: middle; }
td input { width: 100%; min-width: 70px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
.scroll { overflow-x: auto; }
.login { max-width: 380px; margin: 40px auto; display: flex; flex-direction: column; gap: 12px; }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="/"><span class="logo-mark" aria-hidden="true">فز</span><span><b>فز و العب للكبار</b><small>لوحة الإدارة</small></span></a>
  <button class="btn btn-ghost" id="logout" type="button" style="margin-inline-start:auto" hidden>خروج</button>
</div></header>

<main><div class="wrap">
  <form class="card login" id="login" hidden>
    <h1 style="font-size:1.4rem">دخول الإدارة</h1>
    <div class="field"><label for="em">الإيميل</label><input id="em" type="email" autocomplete="username" required></div>
    <div class="field"><label for="pw">كلمة السر</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <p class="err" id="lerr" hidden></p>
    <button class="btn btn-main" type="submit">دخول</button>
  </form>

  <div id="app" hidden>
    <div class="bar">
      <h1>الطلبات</h1>
      <div class="tabs" id="view-tabs">
        <button type="button" data-view="orders" aria-pressed="true">الطلبات</button>
        <button type="button" data-view="products" aria-pressed="false">المنتجات</button>
      </div>
      <button class="btn btn-ghost" id="reload" type="button">تحديث</button>
    </div>

    <section id="v-orders">
      <div class="stats" id="stats"></div>
      <div class="tabs" id="filters" style="margin-bottom:12px"></div>
      <div class="orders" id="orders"></div>
    </section>

    <section id="v-products" hidden>
      <div class="card scroll">
        <table><thead><tr><th>المنتج</th><th>النوع</th><th>السعر د.ك</th><th>قبل الخصم</th><th>المخزون</th><th>ظاهر</th><th></th></tr></thead><tbody id="prods"></tbody></table>
        <p class="note">المخزون فاضي = ما ينحسب (للألعاب الرقمية). لإضافة منتج جديد أضفه في catalog.js وفي جدول fzk_products بنفس الرمز.</p>
      </div>
    </section>
  </div>
</div></main>

<script src="/config.js"></script>
<script src="/admin/supabase.js"></script>
<script>
(function () {
  'use strict';
  var C = window.FZK, $ = function (id) { return document.getElementById(id); };
  var sb = window.supabase.createClient(C.SB_URL, C.SB_KEY);
  var orders = [], codes = {}, filter = 'open';
  var ST = { new: 'جديد', paid: 'مدفوع', shipped: 'مع المندوب', done: 'مكتمل', cancelled: 'ملغي' };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function kwd(n) { return Number(n).toFixed(3) + ' د.ك'; }
  function wa(phone, text) { return 'https://wa.me/965' + phone + '?text=' + encodeURIComponent(text); }

  async function boot() {
    var s = (await sb.auth.getSession()).data.session;
    if (!s) { $('login').hidden = false; $('app').hidden = true; $('logout').hidden = true; return; }
    var ok = (await sb.rpc('fzk_is_admin')).data;
    if (!ok) { $('login').hidden = false; $('lerr').textContent = 'هذا الحساب ما عنده صلاحية إدارة.'; $('lerr').hidden = false; await sb.auth.signOut(); return; }
    $('login').hidden = true; $('app').hidden = false; $('logout').hidden = false;
    load();
  }
  $('login').addEventListener('submit', async function (e) {
    e.preventDefault(); $('lerr').hidden = true;
    var r = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
    if (r.error) { $('lerr').textContent = 'الإيميل أو كلمة السر غلط.'; $('lerr').hidden = false; return; }
    boot();
  });
  $('logout').addEventListener('click', async function () { await sb.auth.signOut(); boot(); });
  $('reload').addEventListener('click', load);

  async function load() {
    var o = await sb.from('fzk_orders').select('*, fzk_order_items(*)').order('created_at', { ascending: false }).limit(300);
    orders = o.data || [];
    var c = await sb.from('fzk_codes').select('code,product_id,order_id,uses,devices,revoked').not('order_id', 'is', null);
    codes = {}; (c.data || []).forEach(function (x) { (codes[x.order_id] = codes[x.order_id] || []).push(x); });
    renderOrders(); loadProducts();
  }

  function renderOrders() {
    var today = new Date().toDateString();
    var paid = orders.filter(function (o) { return ['paid', 'shipped', 'done'].indexOf(o.status) >= 0; });
    $('stats').innerHTML =
      '<div class="card"><span class="note">بانتظار الدفع</span><b>' + orders.filter(function (o) { return o.status === 'new'; }).length + '</b></div>' +
      '<div class="card"><span class="note">بانتظار التوصيل</span><b>' + orders.filter(function (o) { return o.has_physical && o.status === 'paid'; }).length + '</b></div>' +
      '<div class="card"><span class="note">طلبات اليوم</span><b>' + orders.filter(function (o) { return new Date(o.created_at).toDateString() === today; }).length + '</b></div>' +
      '<div class="card"><span class="note">المبيعات المدفوعة</span><b>' + kwd(paid.reduce(function (a, o) { return a + Number(o.total); }, 0)) + '</b></div>';
    var F = { open: 'المفتوحة', new: 'جديد', paid: 'مدفوع', done: 'مكتمل', cancelled: 'ملغي', all: 'الكل' };
    $('filters').innerHTML = Object.keys(F).map(function (k) { return '<button type="button" data-f="' + k + '" aria-pressed="' + (k === filter) + '">' + F[k] + '</button>'; }).join('');
    var list = orders.filter(function (o) {
      if (filter === 'all') return true;
      if (filter === 'open') return o.status === 'new' || (o.status === 'paid' && o.has_physical) || o.status === 'shipped';
      if (filter === 'done') return o.status === 'done' || (o.status === 'paid' && !o.has_physical);
      return o.status === filter;
    });
    $('orders').innerHTML = list.length ? list.map(card).join('') : '<div class="card note">ما فيه طلبات هنا.</div>';
  }
  function card(o) {
    var its = o.fzk_order_items || [], cs = codes[o.id] || [];
    var link = location.origin + '/order/?t=' + o.token;
    var payMsg = 'هلا ' + o.name + '، شكراً لطلبك من فز و العب للكبار (' + o.number + ').\nالإجمالي: ' + kwd(o.total) + '\nرابط الدفع KNET: \nبعد الدفع تقدر تتابع طلبك هنا: ' + link;
    var codeMsg = 'هلا ' + o.name + '، تم تأكيد الدفع لطلبك ' + o.number + ' 🎉\n' +
      cs.map(function (c) { return c.product_id + ': ' + c.code; }).join('\n') + '\nافتح ألعابك من هنا: ' + link;
    var acts = [];
    if (o.status === 'new') acts.push('<button class="btn btn-main" data-st="paid" data-id="' + o.id + '">تم الدفع' + (its.some(function (i) { return i.kind === 'digital'; }) ? ' (يطلع الأكواد)' : '') + '</button>');
    if (o.has_physical && o.status === 'paid') acts.push('<button class="btn btn-brand" data-st="shipped" data-id="' + o.id + '">مع المندوب</button>');
    if (o.has_physical && (o.status === 'paid' || o.status === 'shipped')) acts.push('<button class="btn btn-brand" data-st="done" data-id="' + o.id + '">تم التوصيل</button>');
    if (o.status === 'new') acts.push('<a class="btn btn-ghost" target="_blank" rel="noopener" href="' + esc(wa(o.phone, payMsg)) + '">أرسل رابط الدفع</a>');
    if (cs.length) acts.push('<a class="btn btn-ghost" target="_blank" rel="noopener" href="' + esc(wa(o.phone, codeMsg)) + '">أرسل الأكواد</a>');
    acts.push('<a class="btn btn-ghost" target="_blank" rel="noopener" href="' + esc(link) + '">صفحة الطلب</a>');
    if (o.status !== 'cancelled' && o.status !== 'done') acts.push('<button class="btn btn-ghost" data-st="cancelled" data-id="' + o.id + '">إلغاء</button>');
    return '<article class="card"><div class="o-head"><span class="no num">' + esc(o.number) + '</span><span class="st ' + o.status + '">' + ST[o.status] + '</span>' +
      '<span>' + esc(o.name) + '</span><a href="https://wa.me/965' + esc(o.phone) + '" target="_blank" rel="noopener" class="num">+965 ' + esc(o.phone) + '</a>' +
      '<span class="note">' + new Date(o.created_at).toLocaleString('ar-KW') + '</span></div>' +
      '<div class="o-body"><div>' + its.map(function (i) { return esc(i.name_ar) + ' × ' + i.qty + ' <span class="note">(' + (i.kind === 'digital' ? 'رقمية' : 'توصيل') + ')</span>'; }).join('<br>') +
      '<br><b>' + kwd(o.total) + '</b> · ' + (o.pay_method === 'knet' ? 'KNET' : 'كاش') + (Number(o.delivery) ? ' · شامل توصيل ' + kwd(o.delivery) : '') + '</div>' +
      '<div>' + (o.has_physical ? esc([o.governorate, o.area, o.address].filter(Boolean).join('، ')) : '<span class="note">بدون توصيل</span>') +
      (o.notes ? '<br><span class="note">ملاحظة: ' + esc(o.notes) + '</span>' : '') +
      (cs.length ? '<div class="codes">' + cs.map(function (c) { return esc(c.code) + ' · ' + c.devices.length + '/3' + (c.revoked ? ' ✕' : ''); }).join('<br>') + '</div>' : '') + '</div></div>' +
      '<div class="o-acts">' + acts.join('') + '</div></article>';
  }
  $('filters').addEventListener('click', function (e) { var b = e.target.closest('[data-f]'); if (b) { filter = b.dataset.f; renderOrders(); } });
  $('orders').addEventListener('click', async function (e) {
    var b = e.target.closest('[data-st]'); if (!b) return;
    if (b.dataset.st === 'cancelled' && !confirm('تبي تلغي الطلب؟ أكواد الألعاب بتتوقف.')) return;
    b.disabled = true;
    var r = await sb.from('fzk_orders').update({ status: b.dataset.st }).eq('id', b.dataset.id);
    if (r.error) alert('ما قدرنا نحدّث الطلب: ' + r.error.message);
    load();
  });

  // Products
  async function loadProducts() {
    var r = await sb.from('fzk_products').select('*').order('sort');
    $('prods').innerHTML = (r.data || []).map(function (p) {
      return '<tr data-id="' + esc(p.id) + '"><td><b>' + esc(p.name_ar) + '</b><br><span class="note num">' + esc(p.id) + '</span></td>' +
        '<td>' + (p.kind === 'digital' ? 'رقمية' : 'لوحية') + '</td>' +
        '<td><input data-k="price_kwd" inputmode="decimal" value="' + p.price_kwd + '"></td>' +
        '<td><input data-k="old_price_kwd" inputmode="decimal" value="' + (p.old_price_kwd == null ? '' : p.old_price_kwd) + '"></td>' +
        '<td><input data-k="stock" inputmode="numeric" value="' + (p.stock == null ? '' : p.stock) + '"></td>' +
        '<td><input data-k="active" type="checkbox" style="width:auto;min-width:0"' + (p.active ? ' checked' : '') + '></td>' +
        '<td><button class="btn btn-brand" type="button" data-save style="min-height:36px;padding:4px 12px">حفظ</button></td></tr>';
    }).join('');
  }
  $('prods').addEventListener('click', async function (e) {
    var b = e.target.closest('[data-save]'); if (!b) return;
    var tr = b.closest('tr'), v = function (k) { return tr.querySelector('[data-k=' + k + ']'); };
    var num = function (s) { s = s.trim(); return s === '' ? null : Number(s); };
    var row = { price_kwd: num(v('price_kwd').value), old_price_kwd: num(v('old_price_kwd').value), stock: num(v('stock').value),
      active: v('active').checked, updated_at: new Date().toISOString() };
    if (row.price_kwd == null || isNaN(row.price_kwd)) return alert('اكتب السعر.');
    var r = await sb.from('fzk_products').update(row).eq('id', tr.dataset.id);
    b.textContent = r.error ? 'خطأ' : 'تم'; if (r.error) alert(r.error.message);
    setTimeout(function () { b.textContent = 'حفظ'; }, 1500);
  });
  $('view-tabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-view]'); if (!b) return;
    document.querySelectorAll('#view-tabs button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    $('v-orders').hidden = b.dataset.view !== 'orders'; $('v-products').hidden = b.dataset.view !== 'products';
  });
  boot();
})();
</script>
</body>
</html>
