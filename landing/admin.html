<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>لوحة فز و العب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column — the sign-up count, then one card per customer with a WhatsApp button. */
:root {
  --bg: #F7F4EC;
  --surface: #FFFFFF;
  --ink: #1B2A4A;
  --muted: #5B6680;
  --line: #E6DDC8;
  --sea: #0A7F96;
  --sun: #FFC23D;
  --coral: #E5533F;
  --wa: #1FA855;
  --font-display: "Baloo Bhaijaan 2", "Tajawal", system-ui, sans-serif;
  --font-body: "Tajawal", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111A2C; --surface: #18233A; --ink: #F1ECE1; --muted: #A6B0C4; --line: #2C3A58; --sea: #4CC3D9; --sun: #FFC94F; --coral: #FF7D6E; --wa: #3CC774; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6; }
[hidden] { display: none !important; }
.wrap { max-width: 560px; margin-inline: auto; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 16px; }
h1 { font-family: var(--font-display); font-size: 1.4rem; margin: 0; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--sea); outline-offset: 2px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.ghost { background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: .9rem; cursor: pointer; }
.primary { background: var(--sun); color: #1B2A4A; border: 0; border-radius: 999px; padding: 12px; font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; cursor: pointer; }
.primary:disabled { opacity: .6; }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 18px; }

.login { margin-top: 12vh; display: flex; flex-direction: column; gap: 14px; }
.login h1 { text-align: center; }
label { font-weight: 700; font-size: .95rem; display: block; margin-bottom: 6px; }
input { background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; direction: ltr; text-align: left; }
input:focus { outline: none; border-color: var(--sea); }
.err { color: var(--coral); font-size: .92rem; min-height: 1.2em; }

.count { text-align: center; padding-block: 22px; }
.count b { display: block; font-family: var(--font-display); font-size: 3.4rem; line-height: 1; color: var(--sea); font-variant-numeric: tabular-nums; }
.count span { color: var(--muted); }

.list { display: flex; flex-direction: column; gap: 10px; }
.person { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 12px; }
.info { flex: 1; min-width: 0; }
.info strong { display: block; font-size: 1.08rem; overflow-wrap: anywhere; }
.info small { color: var(--muted); display: block; }
.phone { direction: ltr; unicode-bidi: isolate; }
.wa { flex: none; background: var(--wa); color: #fff; text-decoration: none; font-weight: 700; padding: 10px 16px; border-radius: 999px; }
.empty { text-align: center; color: var(--muted); padding: 24px 8px; }
</style>
</head>
<body>
<div class="wrap">

  <section id="login-view" class="login" hidden>
    <h1>لوحة فز و العب</h1>
    <form id="login-form" class="card" style="display:flex;flex-direction:column;gap:12px" novalidate>
      <div><label for="email">الإيميل</label><input id="email" type="email" autocomplete="username"></div>
      <div><label for="password">كلمة السر</label><input id="password" type="password" autocomplete="current-password"></div>
      <span class="err" id="login-err"></span>
      <button class="primary" type="submit" id="login-btn">دخول</button>
    </form>
  </section>

  <section id="app-view" hidden style="display:flex;flex-direction:column;gap:16px">
    <header class="top">
      <h1>لوحة فز و العب</h1>
      <div style="display:flex;gap:8px">
        <button class="ghost" id="refresh-btn" type="button">تحديث</button>
        <button class="ghost" id="logout-btn" type="button">خروج</button>
      </div>
    </header>
    <div class="card count"><b id="total">–</b><span>حجز</span></div>
    <div class="list" id="list"></div>
  </section>

</div>
<script>
(function () {
  var URL_ = 'https://mxocmwkxnihenqmfhjcc.supabase.co';
  var KEY = 'sb_publishable_NgFczrw5qNiMZN_VDpdeQg_0wcG4wxD';
  var STORE = 'fp-admin-session';
  var AGE = { '3-5': '٣-٥ سنوات', '6-8': '٦-٨ سنوات', more: 'أكثر من طفل' };
  var $ = function (id) { return document.getElementById(id); };
  var session = null;
  var fmt = new Intl.DateTimeFormat('ar-KW', { timeZone: 'Asia/Kuwait', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });

  function save(s) { session = s; try { s ? localStorage.setItem(STORE, JSON.stringify(s)) : localStorage.removeItem(STORE); } catch (e) {} }
  function show(v) { $('login-view').hidden = v !== 'login'; $('app-view').hidden = v !== 'app'; }

  async function auth(grant, body) {
    var r = await fetch(URL_ + '/auth/v1/token?grant_type=' + grant, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    var j = await r.json().catch(function () { return {}; });
    if (!r.ok) throw new Error(j.error_description || j.msg || 'login failed');
    return { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in - 60) * 1000 };
  }
  async function api(path, method) {
    if (Date.now() > session.expires_at) save(await auth('refresh_token', { refresh_token: session.refresh_token }));
    var r = await fetch(URL_ + '/rest/v1/' + path, { method: method || 'GET', headers: { apikey: KEY, Authorization: 'Bearer ' + session.access_token, 'Content-Type': 'application/json' }, body: method === 'POST' ? '{}' : undefined });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }

  function waLink(r) {
    var msg = r.app_lang === 'en'
      ? 'Hi ' + r.parent_name + '! This is the Fizz & Play team. Thank you for reserving a box for your child.'
      : 'هلا ' + r.parent_name + '! معاك فريق فز و العب. شكراً على حجزك لصندوق طفلك.';
    return 'https://wa.me/965' + r.phone + '?text=' + encodeURIComponent(msg);
  }

  async function refresh() {
    try {
      var rows = (await api('signups?select=id,created_at,parent_name,phone,age_group,app_lang&order=created_at.desc'))
        .filter(function (r) { return !/^TEST/.test(r.parent_name); });
      $('total').textContent = rows.length;
      var list = $('list'); list.textContent = '';
      if (!rows.length) {
        var e = document.createElement('div'); e.className = 'empty';
        e.textContent = 'للحين ما فيه حجوزات. أول ما أحد يحجز من الموقع، بيطلع هنا.';
        list.appendChild(e);
      }
      rows.forEach(function (r) {
        var item = document.createElement('div'); item.className = 'person';
        var info = document.createElement('div'); info.className = 'info';
        var name = document.createElement('strong'); name.textContent = r.parent_name;
        var line1 = document.createElement('small');
        var ph = document.createElement('span'); ph.className = 'phone'; ph.textContent = '+965 ' + r.phone;
        line1.appendChild(ph); line1.appendChild(document.createTextNode(' · ' + (AGE[r.age_group] || r.age_group) + (r.app_lang === 'en' ? ' · English' : '')));
        var line2 = document.createElement('small'); line2.textContent = fmt.format(new Date(r.created_at));
        info.appendChild(name); info.appendChild(line1); info.appendChild(line2);
        var wa = document.createElement('a'); wa.className = 'wa'; wa.href = waLink(r); wa.target = '_blank'; wa.rel = 'noopener'; wa.textContent = 'واتساب';
        item.appendChild(info); item.appendChild(wa);
        list.appendChild(item);
      });
    } catch (e) { save(null); show('login'); }
  }

  async function start() {
    var ok = await api('rpc/is_admin', 'POST');
    if (!ok) { save(null); show('login'); $('login-err').textContent = 'هذا الحساب ما عنده صلاحية.'; return; }
    show('app'); refresh();
  }

  $('login-form').addEventListener('submit', async function (e) {
    e.preventDefault(); $('login-err').textContent = ''; $('login-btn').disabled = true;
    try { save(await auth('password', { email: $('email').value.trim(), password: $('password').value })); await start(); }
    catch (err) { $('login-err').textContent = /Invalid login/i.test(err.message) ? 'الإيميل أو كلمة السر غلط.' : 'ما قدرنا ندخل. جرّب مرة ثانية.'; }
    finally { $('login-btn').disabled = false; }
  });
  $('logout-btn').addEventListener('click', function () { save(null); show('login'); });
  $('refresh-btn').addEventListener('click', refresh);

  try { session = JSON.parse(localStorage.getItem(STORE)); } catch (e) {}
  if (session) start().catch(function () { save(null); show('login'); }); else show('login');
})();
</script>
</body>
</html>
