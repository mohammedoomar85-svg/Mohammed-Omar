<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة خدمة العملاء</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f4f4f2; --panel: #fff; --ink: #1c1c1a; --muted: #6b6b66; --line: #e4e4df; --accent: #0f766e; --warn: #b45309; --bad: #b91c1c; --bubble: #f0f0ec; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141413; --panel: #1d1d1b; --ink: #ececea; --muted: #9a9a94; --line: #2e2e2b; --accent: #2dd4bf; --warn: #f59e0b; --bad: #f87171; --bubble: #2a2a27; } }
  :root[data-theme="dark"] { --bg: #141413; --panel: #1d1d1b; --ink: #ececea; --muted: #9a9a94; --line: #2e2e2b; --accent: #2dd4bf; --warn: #f59e0b; --bad: #f87171; --bubble: #2a2a27; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 "IBM Plex Sans Arabic", system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; margin-inline-end: auto; }
  select, input, textarea, button { font: inherit; color: var(--ink); }
  select, input, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 500; }
  :root[data-theme="dark"] button, button.ghost { }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .pill.ai-on { color: var(--accent); border-color: var(--accent); } .pill.ai-off { color: var(--warn); border-color: var(--warn); }
  nav { display: flex; gap: 4px; padding: 8px 16px 0; overflow-x: auto; }
  nav button { background: transparent; color: var(--muted); border-radius: 8px 8px 0 0; }
  nav button[aria-selected="true"] { color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-bottom-color: var(--panel); }
  .wrap { padding: 0 16px 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 0 0 12px 12px; min-height: 70vh; }
  .split { display: grid; grid-template-columns: 320px 1fr; min-height: 70vh; }
  @media (max-width: 760px) { .split { grid-template-columns: 1fr; } .split.open .list { display: none; } .split:not(.open) .detail { display: none; } }
  .list { border-inline-end: 1px solid var(--line); overflow-y: auto; max-height: 78vh; }
  .item { padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:hover, .item.sel { background: var(--bg); }
  .item .top { display: flex; gap: 6px; align-items: center; }
  .item .last { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
  .st-human { color: var(--warn); border-color: var(--warn); } .st-closed { color: var(--muted); }
  .urgent { color: var(--bad); border-color: var(--bad); }
  .detail { display: flex; flex-direction: column; max-height: 78vh; }
  .dhead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .dhead .sp { margin-inline-end: auto; }
  .msgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
  .m { max-width: 80%; padding: 7px 11px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; }
  .m.customer { align-self: flex-start; background: var(--bubble); }
  .m.bot { align-self: flex-end; background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .m.agent { align-self: flex-end; background: var(--accent); color: #fff; }
  .m.system { align-self: center; color: var(--muted); font-size: 12.5px; background: none; }
  .m time { display: block; font-size: 11px; opacity: .7; }
  .reply { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
  .reply textarea { flex: 1; resize: vertical; min-height: 42px; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: start; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  .tablewrap { overflow-x: auto; }
  #login { max-width: 320px; margin: 15vh auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: grid; gap: 10px; }
</style>
</head>
<body>
<form id="login" hidden>
  <h1 style="margin:0;font-size:18px">دخول الموظفين</h1>
  <input type="password" id="pw" placeholder="كلمة المرور" autocomplete="current-password" required>
  <button>دخول</button>
  <small id="lerr" style="color:var(--bad)"></small>
</form>

<div id="app" hidden>
  <header>
    <h1>لوحة خدمة العملاء</h1>
    <span class="pill" id="ai"></span>
    <select id="biz" aria-label="الجهة"><option value="">كل الجهات</option></select>
    <button class="ghost" id="logout">خروج</button>
  </header>
  <nav role="tablist">
    <button role="tab" data-tab="convos" aria-selected="true">المحادثات <span id="n-convos"></span></button>
    <button role="tab" data-tab="tickets" aria-selected="false">التذاكر <span id="n-tickets"></span></button>
    <button role="tab" data-tab="reservations" aria-selected="false">الحجوزات <span id="n-res"></span></button>
  </nav>
  <div class="wrap">
    <div class="panel" id="tab-convos">
      <div class="split" id="split">
        <div class="list" id="clist"></div>
        <div class="detail" id="detail"><div class="empty">اختر محادثة</div></div>
      </div>
    </div>
    <div class="panel tablewrap" id="tab-tickets" hidden></div>
    <div class="panel tablewrap" id="tab-reservations" hidden></div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const ss = { get(k) { try { return sessionStorage.getItem(k); } catch { return null; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch {} }, del(k) { try { sessionStorage.removeItem(k); } catch {} } };
let token = ss.get("sd-admin") || "", data = null, selected = null, bizNames = {};
const STATUS = { bot: "المساعد الآلي", human: "مع موظف", closed: "مغلقة" };
const TSTATUS = { open: "مفتوحة", in_progress: "قيد المعالجة", resolved: "تم الحل" };
const RSTATUS = { pending: "بانتظار التأكيد", confirmed: "مؤكد", cancelled: "ملغي" };
const CAT = { complaint: "شكوى", follow_up: "متابعة", refund: "استرجاع", dispute: "اعتراض", suggestion: "اقتراح", other: "أخرى" };
const PRI = { low: "منخفضة", normal: "عادية", high: "عالية", urgent: "عاجلة" };

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? (e.className = v) : k.startsWith("on") ? (e[k] = v) : e.setAttribute(k, v);
  for (const k of kids) e.append(k ?? "");
  return e;
}
const fmt = (iso) => new Date(iso).toLocaleString("ar-KW", { dateStyle: "short", timeStyle: "short" });

async function api(path, body) {
  const r = await fetch(path, { method: body ? "POST" : "GET", headers: { authorization: "Bearer " + token, "content-type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { showLogin("كلمة المرور غير صحيحة"); throw new Error("unauthorized"); }
  const j = await r.json(); if (!r.ok) throw new Error(j.error); return j;
}
function showLogin(msg) { ss.del("sd-admin"); $("#app").hidden = true; $("#login").hidden = false; $("#lerr").textContent = msg || ""; }
$("#login").onsubmit = async (e) => { e.preventDefault(); token = $("#pw").value; ss.set("sd-admin", token); $("#login").hidden = true; await refresh(); };
$("#logout").onclick = () => { token = ""; showLogin(); };
$("#biz").onchange = () => { selected = null; refresh(); };
document.querySelectorAll("nav button").forEach((b) => b.onclick = () => {
  document.querySelectorAll("nav button").forEach((x) => x.setAttribute("aria-selected", x === b));
  for (const t of ["convos", "tickets", "reservations"]) $("#tab-" + t).hidden = t !== b.dataset.tab;
});

async function refresh() {
  const b = $("#biz").value;
  data = await api("/api/admin/overview" + (b ? "?b=" + b : ""));
  $("#app").hidden = false;
  const ai = $("#ai"); ai.className = "pill " + (data.aiEnabled ? "ai-on" : "ai-off");
  ai.textContent = data.aiEnabled ? "الذكاء الاصطناعي: يعمل" : "وضع الأسئلة الشائعة (بدون مفتاح API)";
  if ($("#biz").options.length === 1) for (const x of data.businesses) $("#biz").append(el("option", { value: x.id }, x.name));
  data.businesses.forEach((x) => bizNames[x.id] = x.name);
  const waiting = data.conversations.filter((c) => c.status === "human").length;
  $("#n-convos").textContent = waiting ? `(${waiting} بانتظار موظف)` : "";
  $("#n-tickets").textContent = `(${data.tickets.filter((t) => t.status !== "resolved").length})`;
  $("#n-res").textContent = `(${data.reservations.filter((r) => r.status === "pending").length})`;
  renderList(); renderTickets(); renderReservations();
  if (selected) openConvo(selected, true);
}

function renderList() {
  const list = $("#clist"); list.replaceChildren();
  if (!data.conversations.length) return list.append(el("div", { class: "empty" }, "لا توجد محادثات بعد"));
  const order = { human: 0, bot: 1, closed: 2 };
  for (const c of [...data.conversations].sort((a, b) => order[a.status] - order[b.status])) {
    const pri = c.handoff?.priority === "urgent" && c.status === "human";
    list.append(el("div", { class: "item" + (c.id === selected ? " sel" : ""), onclick: () => openConvo(c.id) },
      el("div", { class: "top" }, c.unread ? el("span", { class: "dot" }) : "", el("span", { title: c.channel === "voice" ? "مكالمة" : "شات" }, c.channel === "voice" ? "📞" : "💬"), el("b", {}, bizNames[c.businessId] || c.businessId),
        el("span", { class: "pill st-" + c.status + (pri ? " urgent" : "") }, pri ? "عاجل" : STATUS[c.status]),
        el("small", { style: "margin-inline-start:auto;color:var(--muted)" }, fmt(c.updatedAt))),
      c.caller ? el("div", { class: "last", dir: "ltr", style: "text-align:end" }, c.caller) : "",
      el("div", { class: "last" }, c.last)));
  }
}

async function openConvo(id, keepScroll) {
  selected = id; $("#split").classList.add("open");
  const c = await api("/api/admin/conversations/" + id);
  const d = $("#detail"); const prev = d.querySelector(".msgs")?.scrollTop;
  const msgs = el("div", { class: "msgs" });
  for (const l of c.transcript) msgs.append(el("div", { class: "m " + l.role }, l.text, el("time", {}, (l.role === "agent" ? "موظف · " : l.role === "bot" ? "المساعد · " : "") + fmt(l.at))));
  const ta = el("textarea", { placeholder: "اكتب ردك للعميل… (يتولى الموظف المحادثة تلقائياً)" });
  const sendReply = async () => { const text = ta.value.trim(); if (!text) return; await api(`/api/admin/conversations/${id}/reply`, { text }); ta.value = ""; refresh(); };
  ta.onkeydown = (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) sendReply(); };
  const setStatus = (s) => api(`/api/admin/conversations/${id}/status`, { status: s }).then(refresh);
  d.replaceChildren(
    el("div", { class: "dhead" },
      el("button", { class: "ghost", onclick: () => { selected = null; $("#split").classList.remove("open"); } }, "→"),
      el("div", { class: "sp" }, el("b", {}, bizNames[c.businessId]), " ", el("span", { class: "pill" }, c.channel === "voice" ? "مكالمة" + (c.caller ? " · " + c.caller : "") : "شات"), " ", el("span", { class: "pill st-" + c.status }, STATUS[c.status]),
        c.handoff ? el("div", { style: "font-size:12.5px;color:var(--muted)" }, "سبب التحويل: " + c.handoff.reason) : ""),
      c.status !== "bot" ? el("button", { class: "ghost", onclick: () => setStatus("bot") }, "إرجاع للمساعد الآلي") : el("button", { class: "ghost", onclick: () => setStatus("human") }, "تولي المحادثة"),
      c.status !== "closed" ? el("button", { class: "ghost", onclick: () => setStatus("closed") }, "إغلاق") : ""),
    msgs,
    c.channel === "voice"
      ? el("div", { class: "empty", style: "padding:12px" }, "هذا سجل مكالمة هاتفية" + (c.caller ? " — تقدر تتصل على العميل: " + c.caller : ""))
      : el("div", { class: "reply" }, ta, el("button", { onclick: sendReply }, "إرسال")));
  msgs.scrollTop = keepScroll && prev != null ? prev : msgs.scrollHeight;
  renderList();
}

function statusSelect(kind, item, labels) {
  const s = el("select", { "aria-label": "الحالة" });
  for (const [k, v] of Object.entries(labels)) { const o = el("option", { value: k }, v); if (k === item.status) o.selected = true; s.append(o); }
  s.onchange = () => api(`/api/admin/${kind}/${item.id}`, { status: s.value }).then(refresh);
  return s;
}
function renderTickets() {
  const box = $("#tab-tickets"); box.replaceChildren();
  if (!data.tickets.length) return box.append(el("div", { class: "empty" }, "لا توجد تذاكر"));
  const tb = el("tbody");
  for (const t of data.tickets) tb.append(el("tr", {},
    el("td", {}, el("b", {}, t.id), el("br"), el("small", {}, fmt(t.createdAt))), el("td", {}, bizNames[t.businessId]),
    el("td", {}, CAT[t.category] || t.category), el("td", {}, el("span", { class: "pill" + (t.priority === "urgent" ? " urgent" : "") }, PRI[t.priority] || t.priority)),
    el("td", {}, t.summary, t.reference ? el("div", {}, el("small", {}, "مرجع: " + t.reference)) : ""),
    el("td", {}, t.customer_name || "—", el("br"), el("small", { dir: "ltr" }, t.phone || "")),
    el("td", {}, statusSelect("tickets", t, TSTATUS)),
    el("td", {}, t.conversationId ? el("button", { class: "ghost", onclick: () => { document.querySelector('[data-tab="convos"]').click(); openConvo(t.conversationId); } }, "المحادثة") : "")));
  box.append(el("table", {}, el("thead", {}, el("tr", {}, ...["المرجع", "الجهة", "النوع", "الأولوية", "الوصف", "العميل", "الحالة", ""].map((h) => el("th", {}, h)))), tb));
}
function renderReservations() {
  const box = $("#tab-reservations"); box.replaceChildren();
  if (!data.reservations.length) return box.append(el("div", { class: "empty" }, "لا توجد حجوزات"));
  const tb = el("tbody");
  for (const r of data.reservations) tb.append(el("tr", {},
    el("td", {}, el("b", {}, r.id)), el("td", {}, bizNames[r.businessId]),
    el("td", {}, r.customer_name, el("br"), el("small", { dir: "ltr" }, r.phone)),
    el("td", { dir: "ltr", style: "text-align:end" }, `${r.date} ${r.time}`), el("td", {}, String(r.party_size)),
    el("td", {}, r.notes || "—"), el("td", {}, statusSelect("reservations", r, RSTATUS))));
  box.append(el("table", {}, el("thead", {}, el("tr", {}, ...["المرجع", "الجهة", "العميل", "الموعد", "الأشخاص", "ملاحظات", "الحالة"].map((h) => el("th", {}, h)))), tb));
}

if (token) refresh().catch(() => {}); else showLogin();
setInterval(() => { if (token && !document.hidden && !$("#app").hidden && document.activeElement?.tagName !== "TEXTAREA") refresh().catch(() => {}); }, 6000);
</script>
</body>
</html>
